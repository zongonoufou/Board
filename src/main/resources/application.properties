spring.application.name=Board

# H2 en memoire : DB_CLOSE_DELAY=-1 garde la base vivante entre les connexions
spring.datasource.url=jdbc:h2:mem:boarddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Les dates sont serialisees en ISO-8601 et non en timestamp numerique
spring.jackson.serialization.write-dates-as-timestamps=false

server.port=8080
