# Profil "postgres" : s'active avec SPRING_PROFILES_ACTIVE=postgres.
#
# Rappel de l'ordre de priorite (voir docs/APPRENDRE.md B.6) :
#   variables d'environnement  >  application-{profil}.properties  >  application.properties
# Ce fichier ecrase donc les valeurs H2 du fichier principal, et les variables
# SPRING_DATASOURCE_* ecrasent CE fichier. C'est voulu : aucun mot de passe
# n'est stocke dans le depot.
#
# Les 4 proprietes ci-dessous sont des VALEURS PAR DEFAUT pour un PostgreSQL
# local de developpement. Surchargez-les par l'environnement :
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
#   SPRING_DATASOURCE_DRIVER_CLASS_NAME
#
# ATTENTION : ne pas oublier le driver ! application.properties declare
# org.h2.Driver ; si seule l'URL est remplacee, HikariCP garde le driver H2 et
# refuse l'URL ("Driver org.h2.Driver claims to not accept jdbcUrl, jdbc:postgresql:...").

spring.datasource.url=jdbc:postgresql://localhost:5432/board
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=

# La console H2 n'a plus de sens quand la DataSource est PostgreSQL.
spring.h2.console.enabled=false

# Developpement uniquement : Hibernate cree/altere les 3 tables au demarrage.
# En production, utiliser plutot validate + Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update

# Pas de spring.jpa.database-platform ici : Hibernate 6 detecte seul
# PostgreSQLDialect en lisant les metadonnees JDBC de la connexion.
